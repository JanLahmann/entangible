# Deploys the Entangible Pocket demo (pocket-app/dist) to GitHub Pages.
#
# Triggers: every push to main that touches the app, a manual run, and the
# `family-updated` event JanLahmann/Fun-with-Quantum fires when the family
# roster changes (the prebuild step fetches the fresh manifest).
name: deploy-pocket

on:
  push:
    branches: [main]
    paths: ["pocket-app/**", "shared/**", ".github/workflows/deploy-pocket.yml"]
  workflow_dispatch:
  repository_dispatch:
    types: [family-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 20 like ci.yml: Node 22's bundled npm fails `npm ci` on the
      # @qamposer/react git dependency ("git dep preparation failed …
      # Cannot read properties of null (reading 'edgesOut')").
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pocket-app/package-lock.json
      # pocket-app imports the neutral top-level shared/ sources via the
      # @quantum/@shared aliases; @qamposer/react etc. resolve from pocket-app's
      # own node_modules. It is the ONE app (Entangible One) — served standalone
      # here on Pages, and at / · /?kiosk · /debug by the booth host.
      - name: Install and build pocket-app
        run: |
          npm ci
          npm run build
        working-directory: pocket-app
      - name: Run pocket tests
        run: npx vitest run
        working-directory: pocket-app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pocket-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
