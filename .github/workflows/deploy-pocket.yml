# Deploys the Entangible Pocket demo (pocket-app/dist) to GitHub Pages.
#
# Triggers: every push to main that touches the app, a manual run, and the
# `family-updated` event JanLahmann/Fun-with-Quantum fires when the family
# roster changes (the prebuild step fetches the fresh manifest).
name: deploy-pocket

on:
  push:
    branches: [main]
    paths: ["pocket-app/**", "shared/**", ".github/workflows/deploy-pocket.yml"]
  workflow_dispatch:
  repository_dispatch:
    types: [family-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 20 like ci.yml (@qamposer/react is vendored since 2026-10-17,
      # see pocket-app/vendor/README.md).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pocket-app/package-lock.json
      # pocket-app imports the neutral top-level shared/ sources via the
      # @quantum/@shared aliases; @qamposer/react etc. resolve from pocket-app's
      # own node_modules. It is the ONE app (Entangible One) — served standalone
      # here on Pages, and at / · /?kiosk · /debug by the booth host.
      - name: Install and build pocket-app
        run: |
          npm ci
          npm run build
        working-directory: pocket-app
      - name: Run pocket tests
        run: npx vitest run
        working-directory: pocket-app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pocket-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing, Yandex & co. which pages changed: the Fun with Quantum family's
  # shared IndexNow job reads sitemap.xml and submits the pages whose <lastmod>
  # is today or yesterday (family/indexnow/README.md in JanLahmann/Fun-with-Quantum).
  # The key is public by design; pocket-app/public/<key>.txt serves it.
  indexnow:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    uses: JanLahmann/Fun-with-Quantum/.github/workflows/indexnow.yml@master
    with:
      site: https://entangible.org
      key: bac991b9adabcd7c8eb2aa855e35fd65
