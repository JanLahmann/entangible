# Quantum Runner bundle — the runner-only build of the pocket app that the Fun
# with Quantum iOS app embeds offline (docs/runner-bundle.md). The twin of
# golf-release.yml.
#
# The iOS project pins one release asset by URL + sha256 and unpacks it into its
# app bundle (served at fwq://app/runner/index.html). The archive is rooted at
# the bundle itself: index.html, LICENSE and THIRD_PARTY_NOTICES.txt at the top
# level, everything else under assets/.
#
# Assets on the `runner-v*` release:
#   * entangible-runner-<short-sha>.tar.gz         — the contents of pocket-app/dist-runner
#   * entangible-runner-<short-sha>.tar.gz.sha256  — `<hex>  <file name>`
# The short SHA names the commit the bundle was built from, so a pin says
# exactly which source it is. `runner-vN` (or `runner-vN.M…`) is a full release,
# `runner-vN-<suffix>` (e.g. runner-v1-rc1) a prerelease.
#
# Runner releases are NEVER marked "latest": the app and README download the
# printable kit via releases/latest/download/<asset>, which the `kit-*`
# releases (artifacts.yml) must keep owning.
name: runner-release

on:
  push:
    tags: ["runner-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing runner-v* tag to (re)build the runner bundle for"
        required: true

permissions:
  contents: write

concurrency:
  group: runner-release
  cancel-in-progress: false

jobs:
  bundle:
    name: build runner bundle + release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${INPUT_TAG}"
          fi
          case "$tag" in
            runner-v*) ;;
            *) echo "::error::tag '$tag' is not a runner-v* tag"; exit 1 ;;
          esac
          if [[ "$tag" =~ ^runner-v[0-9]+(\.[0-9]+)*$ ]]; then
            prerelease=false
          else
            prerelease=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # Build exactly the tagged commit (also for a manual re-run).
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}

      # Node 20 like ci.yml / golf-release.yml (@qamposer/react is vendored,
      # see pocket-app/vendor/README.md).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pocket-app/package-lock.json

      - name: Install, build and check the runner bundle
        working-directory: pocket-app
        run: |
          npm ci
          npm run build:runner
          node scripts/check-bundle.mjs --bundle runner

      - name: Package bundle
        id: pack
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=7 HEAD)"
          name="entangible-runner-$short.tar.gz"
          test -f pocket-app/dist-runner/index.html
          test -f pocket-app/dist-runner/LICENSE
          test -f pocket-app/dist-runner/THIRD_PARTY_NOTICES.txt
          mkdir -p release
          # Deterministic archive: sorted, numeric root owner, fixed mtimes, and
          # gzip without a name/timestamp header — the same commit always
          # yields the same bytes, so the pinned sha256 stays reproducible.
          tar -C pocket-app/dist-runner --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime='2000-01-01 00:00Z' --format=gnu -cf - . | gzip -9n > "release/$name"
          (cd release && sha256sum "$name" > "$name.sha256")
          cat "release/$name.sha256"
          tar -tzf "release/$name" | head -20
          ls -l release
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"

      - name: Publish release ${{ steps.meta.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          name="${{ steps.pack.outputs.name }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            flags=(--latest=false)
            [ "${{ steps.meta.outputs.prerelease }}" = "true" ] && flags+=(--prerelease)
            gh release create "$tag" "${flags[@]}" \
              --title "Quantum Runner bundle $tag" \
              --notes "Runner-only web bundle (pocket-app/dist-runner) for the Fun with Quantum iOS app, built from ${{ steps.pack.outputs.short }}. Entry: index.html at the archive root; pin the tarball by URL + sha256 — see docs/runner-bundle.md. Not the printable kit (that is the kit-* releases)."
          fi
          gh release upload "$tag" --clobber "release/$name" "release/$name.sha256"
