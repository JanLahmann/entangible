# Entangible CI — the whole repo, on every push to main and every pull request.
#
# Two independent jobs, mirroring the two toolchains:
#   * python — the uv workspace (vision, assets, host, hardware): `uv run pytest`
#   * pocket — the Vite/React app: typecheck, vitest, production build, and the
#     golf-only and runner-only bundles for the iOS app (build:golf / build:runner
#     + their guard, docs/golf-bundle.md, docs/runner-bundle.md)
#
# Every step runs a bare command so its real exit code fails the job; nothing is
# piped into grep/tee, which would mask a non-zero status.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded PR pushes are pointless to finish, but every commit that lands on
# main must get its own verdict — main is pushed to often enough that cancelling
# would leave commits permanently untested.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Installs every workspace member editable into .venv, including
      # build123d/OpenCASCADE (manylinux wheels) used by the hardware suite.
      - name: uv sync
        run: uv sync

      - name: pytest
        run: uv run pytest -q

  pocket:
    name: pocket-app (typecheck, vitest, build, golf + runner bundles)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pocket-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pocket-app/package-lock.json

      - name: npm ci
        run: npm ci

      - name: typecheck
        run: ./node_modules/.bin/tsc --noEmit

      - name: vitest
        run: ./node_modules/.bin/vitest run

      - name: build
        run: npm run build

      # The golf-only bundle embedded offline by the Fun with Quantum iOS app,
      # and its guard (relative paths, no network APIs, excluded modules
      # absent, hover policy, licence files) plus a size report.
      - name: build golf bundle
        run: npm run build:golf

      - name: check golf bundle
        run: node scripts/check-bundle.mjs --bundle golf

      # The runner-only bundle for the same app (docs/runner-bundle.md), same
      # guard with the runner's profile (golf and the editor library absent too).
      - name: build runner bundle
        run: npm run build:runner

      - name: check runner bundle
        run: node scripts/check-bundle.mjs --bundle runner
