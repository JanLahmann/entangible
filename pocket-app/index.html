<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale / user-scalable=no: pinch-zoom must stay available
         (accessibility). Gesture surfaces opt out with `touch-action` CSS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Entangible Pocket</title>
    <meta
      name="description"
      content="Build quantum circuits with your hands: lay printed tiles under a camera and watch the circuit and its results update live. No account needed — it all runs in your browser."
    />

    <!-- Link previews (Open Graph / Twitter). og:image is public/og-image.png,
         a 1200×630 white-backed crop of examples/renders/bell-on-mat.png. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://entangible.org/" />
    <meta property="og:site_name" content="Entangible" />
    <meta property="og:title" content="Entangible — build quantum circuits with your hands" />
    <meta
      property="og:description"
      content="Lay physical tiles under a camera and watch them become a live quantum circuit — no account, everything runs in your browser."
    />
    <meta property="og:image" content="https://entangible.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hadamard, control and target tiles standing on the Entangible circuit mat — a Bell state." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Entangible — build quantum circuits with your hands" />
    <meta
      name="twitter:description"
      content="Lay physical tiles under a camera and watch them become a live quantum circuit — no account, everything runs in your browser."
    />
    <meta name="twitter:image" content="https://entangible.org/og-image.png" />

    <!-- iOS standalone / Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Entangible" />
    <meta name="theme-color" content="#0f1117" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <!-- Umami analytics — shared Fun with Quantum family property (cookie-free).
         data-domains keeps dev servers and offline/kiosk-LAN builds out of the numbers. -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="97f347ac-e7ba-4be3-b26f-ab4b328bdbf2" data-domains="entangible.org"></script>

    <!-- Boot splash: painted from this file alone, before any script or
         stylesheet arrives (a phone on a weak fair WLAN would otherwise stare at
         a blank page). React replaces #root's contents on mount; the lazily
         loaded kiosk / debug surfaces reuse these classes as their loading
         fallback (LazyBoundary.tsx BootSplash). Colours are shared/tokens.css
         (--bg, --text, --muted, --entangle): the app is dark-only, so the splash
         stays dark under a light system theme too — no light→dark flash. -->
    <style>
      html,
      body {
        margin: 0;
        background: #0f1117;
        color-scheme: dark;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        padding: 1.5rem;
        text-align: center;
        background: #0f1117;
        color: #e6e9ef;
        font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      }
      .boot-splash__brand {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .boot-splash__en {
        color: #7a5cff;
      }
      .boot-splash__line {
        font-size: 1rem;
        color: #8a91a0;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status">
        <div class="boot-splash__brand"><span class="boot-splash__en">En</span>tangible</div>
        <div class="boot-splash__line">Build quantum circuits with your hands</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
