<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Share entry for Quantum Runner (entangible.org/runner/). Link-preview
         crawlers do not run JS, so a ?mode=runner deep link can only ever show
         the site card; this static page carries the game's own card and sends
         a visitor straight on to the app's runner deep link, keeping the query
         (lang, utm_* …) and hash. Not content of its own:
         noindex, canonical = the deep link. Tests: src/app/sharePages.test.ts. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum Runner · Entangible</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://entangible.org/?mode=runner" />
    <script>
      location.replace('../?mode=runner' + location.search.replace(/^\?/, '&') + location.hash);
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=../?mode=runner" /></noscript>
    <meta
      name="description"
      content="You run in every lane at once. Tap X, H and CX to change your state while you run: coins pay out by probability, obstacles measure you. One or two qubits, in your browser."
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://entangible.org/runner/" />
    <meta property="og:site_name" content="Entangible" />
    <meta property="og:title" content="Quantum Runner — run in every lane at once" />
    <meta
      property="og:description"
      content="You run in every lane at once. Tap X, H and CX to change your state while you run: coins pay out by probability, obstacles measure you. One or two qubits, in your browser."
    />
    <meta property="og:image" content="https://entangible.org/og-runner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Quantum Runner with two qubits in a Bell state: the runner at 50 % in lanes |00⟩ and |11⟩, coins and a red obstacle ahead, and the X, H and CX gate buttons."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quantum Runner — run in every lane at once" />
    <meta
      name="twitter:description"
      content="You run in every lane at once. Tap X, H and CX to change your state while you run: coins pay out by probability, obstacles measure you. One or two qubits, in your browser."
    />
    <meta name="twitter:image" content="https://entangible.org/og-runner.png" />
    <meta
      name="twitter:image:alt"
      content="Quantum Runner with two qubits in a Bell state: the runner at 50 % in lanes |00⟩ and |11⟩, coins and a red obstacle ahead, and the X, H and CX gate buttons."
    />
    <meta name="theme-color" content="#0f1117" />
    <link rel="icon" type="image/svg+xml" href="../icons/icon.svg" />
    <style>
      html,
      body {
        margin: 0;
        background: #0f1117;
        color: #e6e9ef;
        color-scheme: dark;
        font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      }
      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        box-sizing: border-box;
        text-align: center;
      }
      a {
        color: #a996ff;
      }
    </style>
  </head>
  <body>
    <main>
      <p><a href="../?mode=runner">Play Quantum Runner</a></p>
    </main>
  </body>
</html>
